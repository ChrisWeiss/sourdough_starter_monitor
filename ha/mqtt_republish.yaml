# Republish BTHome sourdough readings to MQTT
# Reference copy — prefer installing via Home Assistant UI / config API.
# Adjust entity_id values after HA discovers the BTHome device.
#
# Distance is published in millimetres. In HA, set the distance entity's
# unit of measurement to mm (entity cog → Unit of measurement) so the state
# is not converted to inches before this automation runs.
# Humidity is present with BME280; BMP280 fallback leaves the entity absent → null.

alias: Sourdough BTHome → MQTT
id: sourdough_bthome_mqtt_republish
description: >-
  Mirror BTHome sourdough climate/distance/battery entities to MQTT as
  JSON (distance in mm) for local consumers.
mode: queued
max: 5
triggers:
  - trigger: state
    entity_id:
      - sensor.sourdough_temperature
      - sensor.sourdough_humidity
      - sensor.sourdough_distance
      - sensor.sourdough_battery
      - sensor.sourdough_pressure
conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.sourdough_temperature
        state:
          - unknown
          - unavailable
          - none
actions:
  - action: mqtt.publish
    data:
      topic: sourdough/sourdough/state
      retain: true
      payload: >
        {% set u = state_attr('sensor.sourdough_distance', 'unit_of_measurement') %}
        {% set d = states('sensor.sourdough_distance') | float(0) %}
        {% if u == 'mm' %}
          {% set dist_mm = d %}
        {% elif u == 'cm' %}
          {% set dist_mm = d * 10 %}
        {% elif u == 'm' %}
          {% set dist_mm = d * 1000 %}
        {% elif u in ['in', '"'] %}
          {% set dist_mm = d * 25.4 %}
        {% elif u == 'ft' %}
          {% set dist_mm = d * 304.8 %}
        {% else %}
          {% set dist_mm = d %}
        {% endif %}
        {
          "humidity": {% set h = states('sensor.sourdough_humidity') %}{% if h not in ['unknown', 'unavailable', 'none'] %}{{ h | float }}{% else %}null{% endif %},
          "temp": {{ states('sensor.sourdough_temperature') | float(0) }},
          "distance_mm": {{ dist_mm | round(0) }},
          "distance": {{ (dist_mm / 10) | round(0) }},
          "battery": {{ states('sensor.sourdough_battery') | int(0) }},
          "pressure": {% set p = states('sensor.sourdough_pressure') %}{% if p not in ['unknown', 'unavailable', 'none'] %}{{ p | float }}{% else %}null{% endif %}
        }
