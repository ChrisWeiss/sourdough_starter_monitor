# Assembly wiring — Lolin / WeMos ESP32-WROOM prototype
# Pins match firmware/platformio.ini env:lolin-esp32 (PIN_*).
# BME280 + VL53L3CX share the I2C bus (3.3V only).

metadata:
  title: ESP32 prototype assembly wiring
  description: BME280 + VL53L3CX on shared I2C

connectors:
  MCU:
    type: Lolin / WeMos ESP32-WROOM
    subtype: DevKit
    pinlabels: [3V3, GND, GPIO21, GPIO22]
    notes: PIN_BME_SDA=21 PIN_BME_SCL=22; optional PIN_TOF_XSHUT
  BME280:
    type: BME280
    subtype: I2C module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C; address 0x76 or 0x77
  VL53:
    type: VL53L3CX
    subtype: ToF module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C addr 0x29; keep lid-to-dough ≥ 10 mm (prefer ≥ 30 mm)

cables:
  BME_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
    notes: BME280 power (3.3V)
  TOF_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
    notes: VL53L3CX power (3.3V)
  I2C_BME:
    gauge: 24 AWG
    length: 0.12
    colors: [BU, YE]
    notes: Shared I2C to BME280
  I2C_TOF:
    gauge: 24 AWG
    length: 0.12
    colors: [BU, YE]
    notes: Shared I2C to VL53L3CX

connections:
  - # BME280 power
    - MCU: [1, 2]
    - BME_PWR: [1-2]
    - BME280: [1, 2]
  - # VL53 power
    - MCU: [1, 2]
    - TOF_PWR: [1-2]
    - VL53: [1, 2]
  - # BME280 I2C
    - MCU: [3, 4]
    - I2C_BME: [1-2]
    - BME280: [3, 4]
  - # VL53 I2C (same SDA/SCL)
    - MCU: [3, 4]
    - I2C_TOF: [1-2]
    - VL53: [3, 4]
