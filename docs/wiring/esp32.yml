# Assembly wiring — Lolin / WeMos ESP32-WROOM prototype
# Pins match firmware/platformio.ini env:lolin-esp32 (PIN_*).
# Never feed 5V Echo into GPIO26; use the voltage divider.

metadata:
  title: ESP32 prototype assembly wiring
  description: BME280 I2C + HC-SR04 with Echo voltage divider

connectors:
  MCU:
    type: Lolin / WeMos ESP32-WROOM
    subtype: DevKit
    pinlabels: [3V3, 5V, GND, GPIO21, GPIO22, GPIO25, GPIO26]
    notes: PIN_BME_SDA=21 PIN_BME_SCL=22 PIN_US_TRIG=25 PIN_US_ECHO=26
  BME280:
    type: BME280
    subtype: I2C module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C; address 0x76 or 0x77
  HCSR04:
    type: HC-SR04
    subtype: ultrasonic
    pinlabels: [VCC, GND, Trig, Echo]
    notes: Module expects 5V VCC; Echo is 5V — divider required
  DIV:
    type: Echo voltage divider
    subtype: 2.2k + 4.7k
    pinlabels: [IN, MID, GND]
    notes: Echo→2.2kΩ→MID→4.7kΩ→GND; MID to GPIO26 only

cables:
  BME_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
    notes: BME280 power (3.3V)
  BME_I2C:
    gauge: 24 AWG
    length: 0.12
    colors: [BU, YE]
    notes: SDA / SCL
  US_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
    notes: HC-SR04 power (5V)
  US_TRIG:
    gauge: 24 AWG
    length: 0.12
    colors: [GN]
    notes: Trig (3.3V OK from ESP32)
  US_ECHO:
    gauge: 24 AWG
    length: 0.08
    colors: [WH]
    notes: 5V Echo into divider IN — not MCU
  DIV_OUT:
    gauge: 24 AWG
    length: 0.08
    colors: [OG]
    notes: Divided ~3.3V to GPIO26
  DIV_GND:
    gauge: 24 AWG
    length: 0.08
    colors: [BK]
    notes: Divider bottom leg to GND

connections:
  - # BME280 power
    - MCU: [1, 3]
    - BME_PWR: [1-2]
    - BME280: [1, 2]
  - # BME280 I2C
    - MCU: [4, 5]
    - BME_I2C: [1-2]
    - BME280: [3, 4]
  - # HC-SR04 power (5V)
    - MCU: [2, 3]
    - US_PWR: [1-2]
    - HCSR04: [1, 2]
  - # Trig
    - MCU: [6]
    - US_TRIG: [1]
    - HCSR04: [3]
  - # Echo → divider IN
    - HCSR04: [4]
    - US_ECHO: [1]
    - DIV: [1]
  - # Divider MID → GPIO26
    - DIV: [2]
    - DIV_OUT: [1]
    - MCU: [7]
  - # Divider GND → MCU GND
    - DIV: [3]
    - DIV_GND: [1]
    - MCU: [3]
