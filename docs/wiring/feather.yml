# Assembly wiring — Adafruit Feather nRF52840
# Pins match firmware/platformio.ini env:nrf52840 (PIN_*).

metadata:
  title: Feather nRF52840 assembly wiring
  description: BME280 + VL53L3CX on shared I2C

connectors:
  MCU:
    type: Adafruit Feather nRF52840
    subtype: Express
    pinlabels: [3V3, GND, SDA_25, SCL_26]
    notes: PIN_BME_SDA=25 PIN_BME_SCL=26; optional PIN_TOF_XSHUT
  BME280:
    type: BME280
    subtype: I2C module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C; Wire.begin() board defaults
  VL53:
    type: VL53L3CX
    subtype: ToF module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C addr 0x29; min range 10 mm

cables:
  BME_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
  TOF_PWR:
    gauge: 24 AWG
    length: 0.12
    colors: [RD, BK]
  I2C_BME:
    gauge: 24 AWG
    length: 0.12
    colors: [BU, YE]
  I2C_TOF:
    gauge: 24 AWG
    length: 0.12
    colors: [BU, YE]

connections:
  - # BME280 power
    - MCU: [1, 2]
    - BME_PWR: [1-2]
    - BME280: [1, 2]
  - # VL53 power
    - MCU: [1, 2]
    - TOF_PWR: [1-2]
    - VL53: [1, 2]
  - # BME280 I2C
    - MCU: [3, 4]
    - I2C_BME: [1-2]
    - BME280: [3, 4]
  - # VL53 I2C
    - MCU: [3, 4]
    - I2C_TOF: [1-2]
    - VL53: [3, 4]
