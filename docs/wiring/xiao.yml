# Assembly wiring — Seeed XIAO nRF52840
# Pins match firmware/platformio.ini env:nrf52840-xiao (PIN_*).
# Confirm SDA/SCL silkscreen on your board revision.
# No 5V rail: use 3.3V-tolerant ultrasonic, or boost + Echo divider (see wiring.md).

metadata:
  title: XIAO nRF52840 assembly wiring
  description: BME280 I2C + ultrasonic (3.3V Echo required)

connectors:
  MCU:
    type: Seeed XIAO nRF52840
    subtype: Sense / BLE
    pinlabels: [3V3, GND, D4_SDA, D5_SCL, D6, D7]
    notes: PIN_BME_SDA=4 PIN_BME_SCL=5 PIN_US_TRIG=6 PIN_US_ECHO=7; confirm silkscreen
  BME280:
    type: BME280
    subtype: I2C module
    pinlabels: [VCC, GND, SDA, SCL]
    notes: 3.3V I2C; address 0x76 or 0x77
  US:
    type: Ultrasonic
    subtype: HC-SR04 / RCWL-1601 / AJ-SR04M
    pinlabels: [VCC, GND, Trig, Echo]
    notes: Echo must be ≤ 3.3V; prefer 3.3V-tolerant module

cables:
  BME_PWR:
    gauge: 24 AWG
    length: 0.10
    colors: [RD, BK]
    notes: BME280 power (3.3V)
  BME_I2C:
    gauge: 24 AWG
    length: 0.10
    colors: [BU, YE]
    notes: SDA / SCL
  US_PWR:
    gauge: 24 AWG
    length: 0.10
    colors: [RD, BK]
    notes: Sensor VCC from 3V3
  US_SIG:
    gauge: 24 AWG
    length: 0.10
    colors: [GN, WH]
    notes: Trig / Echo (Echo ≤ 3.3V)

connections:
  - # BME280 power
    - MCU: [1, 2]
    - BME_PWR: [1-2]
    - BME280: [1, 2]
  - # BME280 I2C
    - MCU: [3, 4]
    - BME_I2C: [1-2]
    - BME280: [3, 4]
  - # Ultrasonic power
    - MCU: [1, 2]
    - US_PWR: [1-2]
    - US: [1, 2]
  - # Trig + Echo
    - MCU: [5, 6]
    - US_SIG: [1-2]
    - US: [3, 4]
