; Sourdough starter monitor — BTHome BLE sensor
; Prototype: Lolin / WeMos ESP32-WROOM DevKit
; Production: nRF52840 (Adafruit Feather / XIAO-compatible SoftDevice builds)

[platformio]
default_envs = lolin-esp32

[common]
build_flags =
	-D SAMPLE_INTERVAL_SEC=90
	-D ADVERTISE_DURATION_MS=1500
	-D DEVICE_NAME=\"sourdough\"
lib_deps =
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:lolin-esp32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_ESP32=1
	-D PIN_BME_SDA=21
	-D PIN_BME_SCL=22
	-D PIN_US_TRIG=25
	-D PIN_US_ECHO=26
lib_deps =
	${common.lib_deps}
	h2zero/NimBLE-Arduino @ ^1.4.3

; Feather nRF52840 Express — adjust board= if you have XIAO / nice!nano
[env:nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_NRF52840=1
	-D PIN_BME_SDA=25
	-D PIN_BME_SCL=26
	-D PIN_US_TRIG=27
	-D PIN_US_ECHO=7
	-DUSE_TINYUSB
lib_deps =
	${common.lib_deps}
