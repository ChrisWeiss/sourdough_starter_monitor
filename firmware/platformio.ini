; Sourdough starter monitor — BTHome BLE sensor
; Prototype: Lolin / WeMos ESP32-WROOM DevKit
; Production: nRF52840 (Pro Micro / Feather / XIAO)
; Distance: VL53L1X ToF (I2C, shared bus with BME280/BMP280)

[platformio]
default_envs = lolin-esp32

[common]
build_flags =
	-D SAMPLE_INTERVAL_SEC=90
	-D ADVERTISE_DURATION_MS=1500
	-D DEVICE_NAME=\"sourdough\"
	-D VBAT_EMPTY_MV=3300.0f
	-D VBAT_FULL_MV=4200.0f
lib_deps =
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/Adafruit BMP280 Library @ ^2.6.8
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit VL53L1X @ ^3.1.2

[env:lolin-esp32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_ESP32=1
	-D PIN_BME_SDA=21
	-D PIN_BME_SCL=22
	; Optional: -D PIN_TOF_XSHUT=25
lib_deps =
	${common.lib_deps}
	h2zero/NimBLE-Arduino @ ^1.4.3

; Feather nRF52840 Express — adjust board= if you have a different Feather revision
[env:nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_NRF52840=1
	-D PIN_BME_SDA=25
	-D PIN_BME_SCL=26
	; Optional: -D PIN_TOF_XSHUT=27
	-DUSE_TINYUSB
lib_deps =
	${common.lib_deps}

; Seeed XIAO nRF52840 pin map (build uses Adafruit SoftDevice BSP; flash via
; XIAO UF2 bootloader / Seeed tools — confirm D4/D5 SDA/SCL on your revision)
[env:nrf52840-xiao]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_NRF52840=1
	-D PIN_BME_SDA=4
	-D PIN_BME_SCL=5
	; Optional: -D PIN_TOF_XSHUT=6
	-DUSE_TINYUSB
lib_deps =
	${common.lib_deps}

; Pro Micro / SuperMini nRF52840 (nice!nano-compatible, Adafruit UF2 / SoftDevice).
; Custom variant: I2C on P0.17/P0.20 (silkscreen 017/020), no Feather QSPI flash.
; Flash: ./scripts/bringup_nrf52840.sh  (or pio run -e nrf52840-promicro -t upload)
[env:nrf52840-promicro]
platform = nordicnrf52
board = adafruit_feather_nrf52840
board_build.variants_dir = variants
board_build.variant = promicro_nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-D BOARD_NRF52840=1
	-D BOARD_NO_VBAT=1
	-D PIN_BME_SDA=29
	-D PIN_BME_SCL=28
	; Optional XSHUT on silkscreen 022 (P0.22) = Feather Arduino D30:
	; -D PIN_TOF_XSHUT=30
	-DUSE_TINYUSB
lib_deps =
	${common.lib_deps}
